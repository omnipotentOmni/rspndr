    <meta name="theme-color" content="#0d1016" />
    <style>
:root {
  color-scheme: dark;
  --bg: #0d1016;
  --panel: #121722;
  --panel-border: rgba(255, 255, 255, 0.08);
  --surface: rgba(255, 255, 255, 0.04);
  --surface-strong: rgba(255, 255, 255, 0.07);
  --text: #f5f7fb;
  --muted: #93a0b4;
  --accent: #7c9cff;
  --accent-soft: rgba(124, 156, 255, 0.14);
  --success: #b7c6ff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

button {
  font: inherit;
}

body {
  padding: 0;
}

.panel {
  min-height: 100vh;
  padding: 16px;
  background:
    radial-gradient(circle at top, rgba(124, 156, 255, 0.16), transparent 30%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0)),
    var(--panel);
}

.panel__header {
  display: block;
}

.brand {
  display: grid;
  gap: 10px;
}

.brand-image {
  display: block;
  width: 152px;
  height: auto;
  object-fit: contain;
}

.partner-mark {
  display: flex;
  justify-content: center;
  margin-top: 18px;
}

.partner-mark img {
  display: block;
  width: 78px;
  height: auto;
  opacity: 0.9;
}

.panel__intro {
  margin: 12px 0 0;
  color: var(--muted);
  line-height: 1.45;
  font-size: 12px;
}

.section {
  margin-top: 14px;
}

.card {
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
}

.controls-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px;
}

.control-copy {
  display: grid;
  gap: 4px;
}

.eyebrow {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.control-title {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}

.control-note {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.35;
}

.toggle {
  position: relative;
  width: 48px;
  height: 28px;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  cursor: pointer;
  flex: 0 0 auto;
  transition: background 160ms ease;
}

.toggle[aria-pressed="true"] {
  background: rgba(124, 156, 255, 0.72);
}

.toggle__knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  transition: transform 160ms ease;
}

.toggle[aria-pressed="true"] .toggle__knob {
  transform: translateX(20px);
}

.metrics-card {
  padding: 14px;
}

.metrics-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--success);
  font-size: 12px;
  font-weight: 600;
}

.status-pill::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: currentColor;
  opacity: 0.95;
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.metric {
  padding: 12px;
  border-radius: 14px;
  background: var(--surface);
}

.metric--wide {
  grid-column: 1 / -1;
}

.metric__label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}

.metric__value {
  display: block;
  margin-top: 6px;
  font-size: 20px;
  line-height: 1;
  font-weight: 650;
}

.metric__value--message {
  font-size: 12px;
  line-height: 1.4;
  color: var(--text);
}

.charts-card {
  padding: 14px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.section-title {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}

.section-meta {
  font-size: 12px;
  color: var(--muted);
}

.chart-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.chart-empty {
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
}

.chart-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 10px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface);
}

.chart-item__name {
  min-width: 0;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chart-item__meta {
  font-size: 11px;
  color: var(--muted);
}

.chart-kind {
  display: inline-flex;
  align-items: center;

}

  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
}

  border-color: rgba(255, 255, 255, 0.18);
}

    <script>
const refs = {
  listenToggle: document.querySelector('#listen-toggle'),
  tracked: document.querySelector('#status-tracked'),
  synced: document.querySelector('#status-synced'),
  listening: document.querySelector('#status-listening'),
  message: document.querySelector('#status-message'),
  scanNow: document.querySelector('#scan-now'),
  foundCount: document.querySelector('#status-found-count'),
  foundLog: document.querySelector('#status-found-log')
};

const state = {
  listening: true
};

function syncUI() {
  refs.listenToggle.setAttribute('aria-pressed', String(state.listening));
  refs.listening.textContent = state.listening ? 'Listening' : 'Paused';
}

function renderChartItem(item) {
  return [
    '<div class="chart-item">',
    '<div>',
    '<div class="chart-item__name">' + item.name + '</div>',
    '<div class="chart-item__meta">Value ' + item.value + '</div>',
    '</div>',
    '<span class="chart-kind">' + item.kind + '</span>',
    '</div>'
  ].join('');
}

function updateFoundLog(items) {
  refs.foundCount.textContent = String(items.length);

  if (!items.length) {
    refs.foundLog.innerHTML = '<div class="chart-empty">No matching progress components on this page.</div>';
    return;
  }

  refs.foundLog.innerHTML = items.map(renderChartItem).join('');
}

refs.listenToggle.addEventListener('click', () => {
  state.listening = !state.listening;
  syncUI();
  parent.postMessage({ pluginMessage: { type: 'set-listening', value: state.listening } }, '*');
});

refs.scanNow.addEventListener('click', () => {
  parent.postMessage({ pluginMessage: { type: 'sync-now' } }, '*');
});

window.addEventListener('message', (event) => {
  const message = event.data && event.data.pluginMessage;
  if (!message) return;

  if (message.type === 'sync-status') {
    refs.tracked.textContent = String(message.tracked || 0);
    refs.synced.textContent = String(message.synced || 0);
    refs.message.textContent = message.message || 'Watching current page';
  }

  if (message.type === 'listening-state') {
    state.listening = !!message.value;
    syncUI();
  }

  if (message.type === 'found-charts') {
    updateFoundLog(message.items || []);
  }
});

syncUI();
updateFoundLog([]);
parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');

    </script>
